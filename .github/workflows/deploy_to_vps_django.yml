name: Deploy Django Project

on:
  push:
    branches:
      - main  # Deploy on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # Latest version

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install sshpass (for password login)
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Deploy to VPS using Password Authentication
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        VPS_PAT: ${{ secrets.VPS_PAT }}
      run: |
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
          # Clone or navigate to the project directory
          cd /root/sales_API || {
            git clone https://${VPS_PAT}@github.com/homemix/sales_API.git /root/sales_API
            cd /root/sales_API
          }

          # Pull the latest changes
          git checkout main
          git pull origin main

          # Set up virtual environment
          python3 -m venv .venv
          source .venv/bin/activate

          # Install dependencies
          pip install -r requirements.txt

          # Set environment variables
          # export DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          # export DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}

          # Apply migrations and collect static files
          python manage.py migrate
          python manage.py collectstatic --noinput

          # Restart services
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
        EOF
